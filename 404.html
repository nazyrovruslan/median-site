<title>Страница не найдена — Median</title>
<script>
/* Одна страница на все ошибки. GitHub Pages отдаёт её на любой несуществующий адрес (404).
   Адреса кейсов (/median-site/southhub) и /about — не ошибка: запоминаем путь и открываем главную, она покажет кейс.
   Код другой ошибки можно передать параметром: 404.html?code=500 (пригодится при переезде на свой сервер). */
var ROOT=/\.github\.io$/.test(location.hostname)?location.pathname.split('/').slice(0,2).join('/')+'/':'/';
document.write('<base href="'+ROOT+'">');
document.documentElement.className='wait';
</script>

<style>
:root{--ink:#0b0b0c;--paper:#f3f3f1;--muted:#8d8d8a;--line:rgba(243,243,241,.14);--display:"Druk Wide Cyr","Arial Black",Arial,sans-serif;--body:"Basis Grotesque Pro","Helvetica Neue",Arial,sans-serif;--g:clamp(16px,4vw,56px);--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box}
html.wait body{visibility:hidden}
body{margin:0;min-height:100svh;background:var(--ink);color:var(--paper);font:400 clamp(14px,.94vw,18px)/1.4 var(--body);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/20% 100%;border-right:1px solid var(--line)}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
header{position:relative;display:flex;justify-content:space-between;align-items:center;padding:var(--g)}
.logo svg{display:block;height:34px;width:auto;fill:currentColor}
.code-tag{font:500 clamp(12px,.73vw,14px)/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
main{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--g) clamp(32px,5vw,96px)}

.big span{display:inline-block;animation:rise 1.1s var(--ease) both}
.big span:nth-child(2){animation-delay:.08s;color:transparent;-webkit-text-stroke:2px var(--paper)}
.big span:nth-child(3){animation-delay:.16s}
@keyframes rise{from{transform:translateY(40%);opacity:0}}
.txt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:clamp(28px,4vw,72px);row-gap:24px}

.side{grid-column:4/6;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.side p{margin:0;font-size:clamp(15px,1.25vw,24px);color:rgba(243,243,241,.8);max-width:26em}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:.6em;height:52px;padding:0 26px;border:1px solid var(--paper);border-radius:999px;font-weight:500;transition:background .3s,color .3s}
.btn:hover,.btn:focus-visible{background:var(--paper);color:var(--ink)}
.btn.main{background:var(--paper);color:var(--ink)}
.btn.main:hover,.btn.main:focus-visible{background:transparent;color:var(--paper)}
.btn svg{width:22px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5}
footer{position:relative;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;padding:20px var(--g) calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--muted);font-size:clamp(12px,.73vw,14px)}
footer a:hover{color:var(--paper)}
@media (max-width:820px){

  h1,.side{grid-column:1/-1}
  .btn{height:48px;padding:0 22px}
}
@media (prefers-reduced-motion:reduce){.big span{animation:none}}
