# Деплой MCP-сервера контента (mcp/) в Cloudflare Workers. Нужны секреты репозитория:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, MCP_GITHUB_TOKEN, MCP_SECRET — см. mcp/README.md.
name: Deploy MCP server
on:
  push:
    branches: [main]
    paths: ['mcp/**', '!mcp/users.json', '.github/workflows/mcp.yml']  # список коллег (admin/mcp.html) воркер читает сам — передеплой не нужен
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # вход в /admin через GitHub (необязательно): GitHub → Settings → Developer settings → OAuth Apps, см. mcp/README.md
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
    steps:
      - name: Check secrets
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then echo "Секреты Cloudflare не заданы — пропускаю (см. mcp/README.md)"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.skip != '1'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp
          secrets: |
            GH_TOKEN
            MCP_SECRET
        env:
          GH_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
      - name: Ключи входа через GitHub
        if: steps.check.outputs.skip != '1' && env.OAUTH_CLIENT_ID != '' && env.OAUTH_CLIENT_SECRET != ''
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$OAUTH_CLIENT_ID" | npx -y wrangler@3 secret put OAUTH_CLIENT_ID
          printf '%s' "$OAUTH_CLIENT_SECRET" | npx -y wrangler@3 secret put OAUTH_CLIENT_SECRET
