name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # сохраняем обратно сгенерированные js/cases.js и превью
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # есть ли сервер median.agency (шаг «Выложить на сервер» ниже): в if секреты напрямую не видны
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # сервер median.agency по схеме админа (ветка deploy + deploy.sh + Docker): секреты SSH_HOST, SSH_USER, SSH_KEY, SSH_PATH
      SSH_HOST: ${{ secrets.SSH_HOST }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # история коммитов без файлов (быстро): tools/build-seo.mjs берёт из неё даты правок для sitemap и вакансий
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # apt-зеркало иногда зависает (11.11 сборка висела 26 мин) — ограничиваем шаг и пробуем ещё раз
      # если apt так и не ответил — сборка идёт дальше без ffmpeg: он нужен только для новых медиа (сжатие, кадры, превью)
      - name: ffmpeg
        timeout-minutes: 4
        continue-on-error: true
        run: command -v ffmpeg || (sudo apt-get update -qq -o Acquire::http::Timeout=30 && sudo apt-get install -y -qq -o Acquire::http::Timeout=30 ffmpeg) || (sleep 10 && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # кейсы, вакансии и КП правятся в content/ (через /admin) — собираем js/cases.js, страницы clients/<адрес>/ и досоздаём превью для новых медиа
      - name: Build content
        env:
          # вебхук Битрикс24 (менеджер проекта из сделки КП); если секрета нет — КП собираются без него
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: |
          # кадрирование по заданиям content/crops/ (admin/crop.html, MCP crop_media); исходники из /admin и MCP: видео → mp4 h.264 нужного размера, фото → webp ≤2400 px (пути в content/ переписываются)
          # счётчики и пиксели из <head> index.html — во все отдельные страницы (политика, согласие, 404); КП берут их сами
          node tools/sync-counters.mjs
          # поля админки для конструктора кейсов (admin/builder.html) — из admin/config.yml
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          python3 tools/build-admin-schema.py
          node tools/crop-media.mjs
          node tools/optimize-media.mjs
          # главная и «О нас» из content/pages (CMS → «Страницы»); index.html с ними и счётчиками кладём в коммит сразу, до простановки ?v= ниже
          node tools/build-pages.mjs
          git add index.html
          node tools/build-cases.mjs
          node tools/build-vacancies.mjs
          node tools/build-icons.mjs
          node tools/build-kp.mjs
          node tools/media.mjs
          # обложки превью ссылок КП (og.png) — через Chrome, который есть на раннере
          node tools/og-kp.mjs || echo "обложки превью КП не нарисованы"
          # сброс кэша данных кейсов: номер версии = короткий хэш коммита
          sed -i -E "s#js/(cases|vacancies|icons)\.js\?v=[^\"]+#js/\1.js?v=${GITHUB_SHA::7}#g" index.html
          # SEO: страницы кейсов/«О нас»/вакансий со своими title и OG (копии index.html), sitemap.xml, robots.txt — после ?v=, чтобы копии получили те же версии
          node tools/build-seo.mjs
          # живой предпросмотр конструктора кейсов: копия главной без счётчиков (admin/preview.html, в репозиторий не коммитится)
          node tools/build-preview.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add -A js/cases.js js/vacancies.js js/icons.js media content clients privacy.html consent.html 404.html admin/schema.json 2>/dev/null || git add -A js/cases.js js/vacancies.js js/icons.js media content
          if ! git diff --cached --quiet; then
            git commit -m "Сборка: js/cases.js, КП, превью и сжатые медиа из content/ [skip ci]"
            git pull --rebase --autostash -q origin main && git push -q origin HEAD:main || echo "не удалось сохранить в репозиторий — на сайт всё равно уйдёт"
          fi
      # Сервер median.agency (схема админа сервера): ветка deploy = main + Dockerfile/Caddyfile/deploy.sh админа.
      # После каждой сборки вливаем main в deploy и запускаем на сервере deploy.sh (git reset на deploy → docker compose build:
      # docker/build.sh собирает сайт, как этот workflow). Пушем от GITHUB_TOKEN workflow deploy.yml не запускается — поэтому ssh здесь.
      # Секреты: SSH_HOST, SSH_USER, SSH_KEY (приватный ключ), SSH_PATH (папка с deploy.sh на сервере). Пока их нет — шаг пропускается.
      - name: Сервер median.agency — ветка deploy и deploy.sh
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          git fetch -q origin main deploy
          rm -rf /tmp/dep && git worktree add -q --detach /tmp/dep origin/deploy
          cd /tmp/dep
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          # при конфликте берём версию из main (файлы админа — Dockerfile, deploy.sh, compose — есть только в deploy и не трогаются)
          git merge -q --no-edit -X theirs -m "Выкладка: main ${GITHUB_SHA::7} → deploy [skip ci]" origin/main
          git push -q origin HEAD:deploy
          cd - >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/srv && chmod 600 ~/.ssh/srv
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # путь из секрета мог вставиться с переводом строки или пробелами — чистим
          SSH_PATH=$(printf '%s' "$SSH_PATH" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#/$##')
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r\n ')
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '\r\n ')
          ssh -i ~/.ssh/srv -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "P='$SSH_PATH'; if [ ! -x \"\$P/deploy.sh\" ]; then Q=\$(dirname \"\$(find ~ -maxdepth 3 -name deploy.sh -path '*median*' 2>/dev/null | head -1)\"); echo \"SSH_PATH не найден, беру папку с deploy.sh: \$(echo \$Q | sed \"s#\$(whoami)#USER#g\")\"; P=\$Q; fi; cd \"\$P\" && ./deploy.sh"
      # свой сервер median.agency: та же собранная папка по SSH (rsync). Секреты в GitHub → Settings → Secrets → Actions:
      # DEPLOY_HOST (158.160.186.96), DEPLOY_USER, DEPLOY_PATH (/var/www/median.agency), DEPLOY_SSH_KEY (приватный ключ, публичный — в ~/.ssh/authorized_keys на сервере).
      # Пока секретов нет — шаг пропускается. Исходники (content, tools, mcp, *.md) на сервер не уходят.
      - name: Выложить на сервер median.agency
        if: ${{ env.DEPLOY_HOST != '' }}
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlptz --delete-after --chmod=D755,F644 \
            --exclude='.git*' --exclude='.github' --exclude='content/' --exclude='tools/' --exclude='mcp/' --exclude='deploy/' \
            --exclude='node_modules' --exclude='*.md' --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new" ./ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
