name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # сохраняем обратно сгенерированные js/cases.js и превью
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # кейсы правятся в content/cases (через /admin) — собираем из них js/cases.js и досоздаём превью для новых медиа
      - name: Build content
        run: |
          node tools/build-cases.mjs
          node tools/media.mjs
          # сброс кэша данных кейсов: номер версии = короткий хэш коммита
          sed -i -E "s#js/cases\.js\?v=[^\"]+#js/cases.js?v=${GITHUB_SHA::7}#" index.html
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add js/cases.js media
          if ! git diff --cached --quiet; then
            git commit -m "Сборка: js/cases.js и превью из content/ [skip ci]"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "не удалось сохранить в репозиторий — на сайт всё равно уйдёт"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
