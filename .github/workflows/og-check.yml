name: Проверка превью КП (временная)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/og-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Что отдаёт сайт
        run: |
          U=https://nazyrovruslan.github.io/median-site/clients/03de7495/
          for ua in "TelegramBot (like TwitterBot)" "Mozilla/5.0"; do
            echo "=== UA: $ua"
            curl -sS -A "$ua" -D - -o page.html "$U" | head -20
            grep -o '<meta [^>]*og:image[^>]*>' page.html
            IMG=$(grep -o 'og:image" content="[^"]*' page.html | head -1 | sed 's/.*content="//')
            echo "img: $IMG"
            curl -sS -A "$ua" -D - -o og.bin "$IMG" | head -20
            file og.bin; md5sum og.bin; ls -l og.bin
          done
          curl -sS -o og2.bin "${U}og.png"; md5sum og2.bin; file og2.bin
