# Sveltia CMS (совместим с Decap CMS). Вход: «Sign In with Token» — GitHub-токен с доступом к репозиторию (см. NOTES.md).
# Каждое сохранение — коммит в main; деплой собирает js/cases.js из content/cases, страницы КП из content/kp и досоздаёт превью/постеры (tools/).
backend:
  name: github
  repo: nazyrovruslan/median-site
  branch: main
  commit_messages:
    create: "CMS: создан {{collection}} {{slug}}"
    update: "CMS: правка — {{collection}} {{slug}}"
    delete: "CMS: удалён {{collection}} {{slug}}"
    uploadMedia: "CMS: загружен файл {{path}}"
    deleteMedia: "CMS: удалён файл {{path}}"

locale: ru
site_url: https://nazyrovruslan.github.io/median-site/
display_url: https://nazyrovruslan.github.io/median-site/

# пути в данных — относительные (сайт живёт в подпапке /median-site/)
media_folder: media/cases
public_folder: media/cases

# фото при загрузке сжимаются в webp
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400

collections:
  - name: cases
    label: Кейсы — проект
    label_singular: кейс
    description: "Кейс одного проекта. Ежегодные проекты, роуд-шоу, сезоны и серии — в «Кейсы — серия проектов»"
    folder: content/cases
    format: json
    extension: json
    identifier_field: id
    slug: "{{id}}"
    summary: "{{order}} · {{name}}"
    sortable_fields: [order, name]
    create: true
    delete: true
    filter: { field: kind, value: project }
    fields:
      - { name: kind, widget: hidden, default: project }
      - &cf_order { name: order, label: Порядок, widget: number, value_type: int, hint: "Место в списке: меньше — выше. Первые 5 — в баннере на главной. Шаг 10, чтобы вставлять между." }
      - &cf_id { name: id, label: Адрес (id), widget: string, pattern: ['^[a-z0-9-]+$', 'только латиница в нижнем регистре, цифры и дефис'], hint: "Часть ссылки: /median-site/<id>. После публикации лучше не менять." }
      - &cf_name { name: name, label: Название, widget: string }
      - &cf_sub { name: sub, label: Подзаголовок, widget: string, hint: "Строка в списке кейсов и под заголовком в баннере" }
      - &cf_tags { name: tags, label: Категории проекта, widget: select, multiple: true, required: false, options: [{ label: "Бренд работодателя", value: employer }, { label: "Внутренние коммуникации", value: internal }, { label: "Сообщества", value: community }, { label: "Собственные проекты", value: own }], hint: "Фильтры над «Все проекты» на главной; можно выбрать несколько. Названия — в TAGS в js/main.js, держать одинаковыми" }
      - &cf_hide { name: hide, label: Скрыть с сайта (только для КП), widget: boolean, required: false, default: false, hint: "Кейса не будет на главной и в списке проектов, но он есть в закрытом каталоге кейсов и его можно добавить в КП; страница кейса открывается по прямой ссылке" }
      - &cf_kp { name: kp, label: Категории для КП, widget: select, multiple: true, required: false, options: [{ label: "Стенды и зоны", value: stands }, { label: "Конференции и форумы", value: conf }, { label: "Выездные мероприятия и кэмпы", value: camp }, { label: "Фестивали и road show", value: fest }, { label: "Хакатоны и IT-соревнования", value: hack }, { label: "Корпоративы и церемонии", value: corp }, { label: "Спецпроекты и digital", value: special }], hint: "По ним КП подбирает релевантный опыт: кейсы категории КП прикрепляются по умолчанию (в порядке списка)" }
      - &cf_dir { name: dir, label: Направление, widget: select, options: [{ label: Внешние, value: external }, { label: Внутренние, value: internal }, { label: Out of the list, value: outlist }, { label: Свой проект, value: own }] }
      - &cf_out { name: out, label: "Заголовок: контурное слово", widget: string, required: false, hint: "Первая строка заголовка (контуром). Если ниже заданы «Строки заголовка» — используются они." }
      - &cf_solid { name: solid, label: "Заголовок: залитое слово", widget: string, required: false }
      - &cf_ttl
        name: ttl
        label: Строки заголовка
        label_singular: строка
        widget: list
        required: false
        hint: "Необязательно: для длинных названий — каждая строка отдельно"
        fields:
          - { name: text, label: Текст, widget: string }
          - { name: outline, label: Контуром, widget: boolean, default: false }
      - &cf_img { name: img, label: Фото обложки, widget: image, required: false, hint: "Горизонтальное, от 1920 px" }
      - &cf_vid { name: vid, label: Видео-обложка, widget: file, required: false, media_folder: /media/video, public_folder: media/video, hint: "mp4 без звука, 6–10 с, до 1280 px, до ~1 МБ. Постер и HEVC-версия сделаются сами при деплое" }
      - &cf_reel { name: reel, label: Видео проекта (ролик), widget: file, required: false, media_folder: /media/video, public_folder: media/video, hint: "mp4 со звуком, блок с видео после фактов. Превью и постер сделаются сами" }
      - &cf_light { name: light, label: Светлое фото, widget: boolean, required: false, default: false, hint: "Тёмный заголовок в «Следующем проекте»" }
      - &cf_c
        name: c
        label: Цвета-заглушки (пока фото грузится)
        widget: list
        required: false
        field: { name: color, label: Цвет, widget: color }
      - &cf_client { name: client, label: Клиент, widget: string, required: false }
      - &cf_cat { name: cat, label: Категория, widget: string, required: false, hint: "Если пусто — по направлению" }
      - &cf_city { name: city, label: Локация, widget: string, required: false }
      - &cf_year { name: year, label: Год, widget: string, required: false }
      - &cf_format { name: format, label: Формат, widget: string, required: false }
      - &cf_services { name: services, label: Услуги, widget: string, required: false }
      - &cf_lead { name: lead, label: Лид (цитата под фактами), widget: text, required: false }
      - &cf_links
        name: links
        label: Сайты проекта
        widget: list
        required: false
        field: { name: url, label: Ссылка, widget: string }
      - &cf_facts
        name: facts
        label: Доп. строки фактов
        label_singular: строку
        widget: list
        required: false
        hint: "Строки в таблице фактов под обложкой, например «Партнёры» или «Концепции»"
        fields:
          - { name: l, label: Подпись, widget: string }
          - { name: v, label: Значение, widget: string }
      - name: blocks
        label: Блоки страницы
        label_singular: блок
        hint: "Страница собирается из блоков сверху вниз: «Добавить блок» → тип (анкета, текст, key message, цифры, видео, фото-карусель и т. д.) → содержимое. Порядок меняется перетаскиванием"
        widget: list
        required: false
        typeKey: t
        types: &blocktypes
          # порядок = порядок в меню «добавить блок»: анкета, текст, key message, цифры, видео, фото-плагины; ниже — блоки старых кейсов
          - name: facts
            label: "Анкета проекта"
            fields:
              - { name: note, label: Заметка для себя, widget: string, required: false, hint: "Таблица фактов, логотип и подзаголовок — из полей кейса выше (клиент, локация, год, формат, сайты, доп. строки фактов). Блок задаёт, где на странице стоит анкета; без него она в самом начале" }
          - name: sec
            label: "Текст с заголовком (Контекст, Задача, Реализация…)"
            fields:
              - { name: h, label: Заголовок, widget: string }
              - { name: q, label: Вопрос под заголовком, widget: string, required: false }
              - { name: cap, label: Подпись вместо номера, widget: string, required: false, hint: "Раздел без номера, например «Data Science»" }
              - { name: lead, label: Лид, widget: text, required: false }
              - { name: text, label: Абзацы, widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
              - { name: label, label: Подпись над пунктами, widget: string, required: false }
              - name: rows
                label: Пункты
                label_singular: пункт
                widget: list
                required: false
                fields:
                  - { name: n, label: Номер (если не 01, 02…), widget: string, required: false }
                  - { name: name, label: Название, widget: string }
                  - { name: text, label: Текст, widget: text }
                  - { name: img, label: Фото пункта, widget: image, required: false, hint: "Если у пунктов есть фото — слева показывается фото выбранного пункта" }
              - name: groups
                label: Группы цифр
                label_singular: группу
                widget: list
                required: false
                fields:
                  - { name: l, label: Подпись группы, widget: string }
                  - name: items
                    label: Цифры
                    label_singular: цифру
                    widget: list
                    fields:
                      - { name: pre, label: Подпись над цифрой, widget: string, required: false }
                      - { name: v, label: Значение, widget: string }
                      - { name: l, label: Подпись под цифрой, widget: string, required: false }
          - name: key
            label: "Key message — ключевая фраза"
            fields:
              - { name: label, label: Ярлык, widget: string, required: false, default: Key message }
              - { name: out, label: Контурная строка, widget: string }
              - { name: solid, label: Залитая строка, widget: string }
          - name: stats
            label: "Цифры проекта"
            fields:
              - name: items
                label: Цифры
                label_singular: цифру
                widget: list
                fields:
                  - { name: v, label: Значение, widget: string }
                  - { name: l, label: Подпись, widget: string }
          - name: years
            label: "Цифры: итоги по годам / городам"
            fields:
              - { name: out, label: Контурная часть заголовка, widget: string, default: Итоги }
              - { name: solid, label: Залитая часть заголовка, widget: string }
              - name: sum
                label: Общие цифры сверху
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: l, label: Подпись, widget: string }
                  - name: items
                    label: Цифры
                    label_singular: цифру
                    widget: list
                    fields:
                      - { name: pre, label: Подпись над цифрой, widget: string, required: false }
                      - { name: v, label: Значение, widget: string }
                      - { name: l, label: Подпись под цифрой, widget: string, required: false }
              - name: rows
                label: Строки
                label_singular: строку
                widget: list
                fields:
                  - { name: y, label: Год или город, widget: string }
                  - { name: sub, label: Даты и место, widget: string, required: false }
                  - name: items
                    label: Цифры
                    label_singular: цифру
                    widget: list
                    fields:
                      - { name: v, label: Значение, widget: string }
                      - { name: l, label: Подпись, widget: string, required: false }
          - name: reel
            label: "Видео проекта"
            fields:
              - { name: reel, label: Видео (mp4 со звуком), widget: file, required: false, media_folder: /media/video, public_folder: media/video, hint: "Если пусто — «Видео проекта» из полей кейса. Без этого блока ролик стоит сразу после анкеты" }
          - name: carousel
            label: "Фото: карусель"
            fields:
              - { name: items, label: Фото, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: gallery
            label: "Фото: галерея с миниатюрами"
            fields:
              - { name: items, label: Фото, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: marquee
            label: "Фото: две бегущие ленты"
            fields:
              - { name: a, label: Верхняя лента, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
              - { name: b, label: Нижняя лента, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: accordion
            label: "Фото: гармошка"
            fields:
              - { name: items, label: Фото, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: bento
            label: "Фото: мозаика из 8"
            fields:
              - { name: items, label: Фото, hint: "8 шт.: 1-е большое, 2-е высокое, 3-е широкое", label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: split
            label: "Текст + сетка фото"
            fields:
              - { name: label, label: Ярлык, widget: string, required: false }
              - { name: h, label: Заголовок, widget: text, hint: "Перенос строки — с новой строки" }
              - { name: text, label: Абзацы, widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
              - { name: items, label: Фото, label_singular: фото, widget: list, field: { name: img, label: Фото, widget: image } }
          - name: photo
            label: "Фото во всю ширину"
            fields:
              - { name: img, label: Фото, widget: image }
          - name: banner
            label: "Фото-баннер с заголовком и карточкой"
            fields:
              - { name: img, label: Фото (или постер видео), widget: image }
              - { name: vid, label: Видео без звука, widget: file, required: false, media_folder: /media/video, public_folder: media/video }
              - { name: out, label: Контурная часть заголовка, widget: string }
              - { name: solid, label: Залитая часть заголовка, widget: string, required: false }
              - { name: text, label: Текст карточки, widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
              - { name: side, label: Карточка, widget: select, options: [{ label: Справа, value: right }, { label: Слева, value: left }], default: right }
          - name: text
            label: "Текст: только заголовок и абзацы (старый)"
            fields:
              - { name: h, label: Заголовок, widget: string }
              - { name: text, label: Абзацы, widget: list, field: { name: p, label: Абзац, widget: text } }
          - name: pairs
            label: "Фото: три фото со словами"
            fields:
              - name: items
                label: Фото
                label_singular: фото
                widget: list
                fields:
                  - { name: img, label: Фото, widget: image }
                  - { name: word, label: Слово поверх (контуром), widget: string, required: false }
                  - { name: text, label: Текст рядом, widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
          - name: feature
            label: "Фото: заголовок + фото + карточка"
            fields:
              - { name: out, label: Контурная часть заголовка, widget: string }
              - { name: solid, label: Залитая часть заголовка, widget: string, required: false }
              - { name: img, label: Фото, widget: image, required: false }
              - { name: fit, label: Фото целиком без обрезки, widget: boolean, required: false }
              - { name: text, label: Текст карточки, widget: list, field: { name: p, label: Абзац, widget: text } }
          - name: cut
            label: "Фото: вырезанное фото + текст"
            fields:
              - { name: img, label: Фото (png/webp с прозрачным фоном), widget: image }
              - { name: text, label: Абзацы, widget: list, field: { name: p, label: Абзац, widget: text } }
          - name: hub
            label: "Перебивка: буквенная сетка"
            fields:
              - { name: start, label: Начало слова (первая клетка), widget: string, hint: "Например, SOUTHU" }
              - { name: letter, label: Повторяющаяся буква, widget: string, default: U }
              - { name: end, label: Последняя буква (в правом нижнем углу), widget: string, hint: "Например, B" }
              - { name: tag, label: Слоган, widget: string }
          - name: links
            label: "Список ссылок"
            fields:
              - { name: h, label: Заголовок, widget: string }
              - name: items
                label: Ссылки
                label_singular: ссылку
                widget: list
                fields:
                  - { name: title, label: Название, widget: string }
                  - { name: sub, label: Подпись, widget: string, required: false }
                  - { name: url, label: Ссылка, widget: string }
          - name: yt
            label: "Видео: плейлист YouTube"
            fields:
              - { name: list, label: ID плейлиста, widget: string, hint: "Часть ссылки после list=" }
          - name: eps
            label: "Видео: выпуски YouTube"
            fields:
              - { name: h, label: Заголовок, widget: string }
              - { name: list, label: ID плейлиста, widget: string }
              - name: items
                label: Выпуски
                label_singular: выпуск
                widget: list
                fields:
                  - { name: id, label: ID видео, widget: string }
                  - { name: title, label: Тема, widget: string }
                  - { name: guest, label: Гость, widget: string, required: false }

  # Кейс-серия: несколько проектов на одной странице (ежегодный проект, роуд-шоу, сезоны). Тот же файл в content/cases, отличается полем kind: series.
  # Страница: общая часть → проекты серии (баннер + свои блоки) → блоки «после» → итоги по проектам (собирает tools/build-cases.mjs)
  - name: series
    label: Кейсы — серия проектов
    label_singular: серию
    description: "Ежегодный проект, роуд-шоу, сезоны: общая история и несколько проектов на одной странице, в конце — итоги по каждому"
    folder: content/cases
    format: json
    extension: json
    identifier_field: id
    slug: "{{id}}"
    summary: "{{order}} · {{name}}"
    sortable_fields: [order, name]
    create: true
    delete: true
    filter: { field: kind, value: series }
    fields:
      - { name: kind, widget: hidden, default: series }
      - *cf_order
      - *cf_id
      - *cf_name
      - *cf_sub
      - *cf_tags
      - *cf_hide
      - *cf_kp
      - *cf_dir
      - *cf_out
      - *cf_solid
      - *cf_ttl
      - *cf_img
      - *cf_vid
      - *cf_reel
      - *cf_light
      - *cf_c
      - *cf_client
      - *cf_cat
      - *cf_city
      - *cf_year
      - *cf_format
      - *cf_services
      - *cf_lead
      - *cf_links
      - *cf_facts
      - name: blocks
        label: Общая часть
        label_singular: секцию
        widget: list
        required: false
        hint: "Контекст, задача, решение, ключевая фраза — то, что общее для всех проектов серии"
        typeKey: t
        types: *blocktypes
      - name: parts
        label: Проекты серии
        label_singular: проект
        widget: list
        hint: "Годы, города или сезоны по порядку. У каждого — строка итогов и, если нужно, баннер и свои блоки"
        summary: "{{y}} · {{sub}}"
        fields:
          - { name: y, label: Год / город / сезон, widget: string, hint: "Крупно в итогах: 2022, Москва, 1.0" }
          - { name: sub, label: Даты и место, widget: string, required: false }
          - name: stats
            label: Цифры для итогов
            label_singular: цифру
            widget: list
            required: false
            fields:
              - { name: v, label: Значение, widget: string }
              - { name: l, label: Подпись, widget: string, required: false }
          - { name: out, label: "Баннер: контурная часть заголовка", widget: string, required: false, hint: "Если есть фото или видео — перед блоками проекта встаёт баннер во всю ширину" }
          - { name: solid, label: "Баннер: залитая часть", widget: string, required: false }
          - { name: img, label: "Баннер: фото (или постер видео)", widget: image, required: false }
          - { name: vid, label: "Баннер: видео без звука", widget: file, required: false, media_folder: /media/video, public_folder: media/video }
          - { name: text, label: "Баннер: текст карточки", widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
          - { name: side, label: "Баннер: карточка", widget: select, required: false, options: [{ label: Справа, value: right }, { label: Слева, value: left }], default: right }
          - name: blocks
            label: Блоки проекта
            label_singular: секцию
            widget: list
            required: false
            typeKey: t
            types: *blocktypes
      - name: after
        label: После проектов
        label_singular: секцию
        widget: list
        required: false
        hint: "Например, общие результаты — встают перед итогами"
        typeKey: t
        types: *blocktypes
      - { name: total, label: "Итоги: залитая часть заголовка", widget: string, required: false, hint: "«Итоги» + это: по годам, по городам, двух сезонов" }
      - name: sum
        label: "Итоги: общие цифры сверху"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: l, label: Подпись, widget: string }
          - name: items
            label: Цифры
            label_singular: цифру
            widget: list
            fields:
              - { name: pre, label: Подпись над цифрой, widget: string, required: false }
              - { name: v, label: Значение, widget: string }
              - { name: l, label: Подпись под цифрой, widget: string, required: false }

  # Скрытый раздел: коммерческие предложения по уникальной ссылке /clients/<адрес>/ (собирает tools/build-kp.mjs)
  - name: kp
    label: КП для клиентов
    label_singular: КП
    folder: content/kp
    format: json
    extension: json
    identifier_field: client
    slug: "{{uuid_shorter}}"
    summary: "{{client}} · {{date}}"
    sortable_fields: [date, client]
    preview_path: "clients/{{slug}}/"
    create: true
    delete: true
    media_folder: /media/kp
    public_folder: media/kp
    description: "Страница КП: https://nazyrovruslan.github.io/median-site/clients/<имя файла>/ — адрес случайный, на сайте раздел нигде не виден и закрыт от поисковиков. Ссылку видно кнопкой «Открыть на сайте» после деплоя (1–2 минуты)."
    fields:
      - { name: client, label: Клиент (компания), widget: string, hint: "Название в списке CMS и на странице" }
      - { name: client_logo, label: Логотип клиента, widget: image, required: false, hint: "SVG или PNG на прозрачном фоне, тёмный — фон страницы серый (на обложке шапки логотип станет белым). Если пусто — название текстом" }
      - { name: cover, label: Обложка шапки (фото), widget: image, required: false, hint: "Как у проектов на сайте: шапка КП во весь экран с заголовком поверх. Горизонтальное, от 1920 px, тёмное внизу слева — там белый заголовок. Это же фото — обложка превью ссылки в Telegram, WhatsApp и соцсетях. Если есть видео, фото показывается, пока видео грузится или если оно не сыграло; если фото не загружено — берётся первый кадр видео. Если пусто и видео нет — шапка и превью серые с заголовком" }
      - { name: cover_video, label: Обложка шапки (видео), widget: file, required: false, hint: "mp4 без звука, 6–10 с, до 1280 px, до ~2 МБ. Играет поверх фото. Лучше загрузить и фото: оно подменит видео, если то не загрузилось или не сыграло, и станет обложкой превью ссылки. Без фото для этого берётся первый кадр видео" }
      - name: client_contact
        label: Контакт со стороны клиента
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: Имя, widget: string, required: false }
          - { name: role, label: Должность, widget: string, required: false }
      - { name: category, label: Категория предложения, widget: select, required: false, options: [{ label: "Стенды и зоны", value: stands }, { label: "Конференции и форумы", value: conf }, { label: "Выездные мероприятия и кэмпы", value: camp }, { label: "Фестивали и road show", value: fest }, { label: "Хакатоны и IT-соревнования", value: hack }, { label: "Корпоративы и церемонии", value: corp }, { label: "Спецпроекты и digital", value: special }], hint: "Если «Релевантный опыт» ниже пуст — туда сами встают кейсы этой категории. Чтобы заменить или добавить — заполните список вручную" }
      - { name: draft, label: Черновик (страница не публикуется), widget: boolean, required: false, default: false }
      - { name: title, label: Заголовок, widget: text, hint: "Каждая строка — отдельной строкой заголовка" }
      - { name: date, label: Дата предложения, widget: datetime, time_format: false, format: "YYYY-MM-DD", default: "{{now}}" }
      - { name: event_date, label: Дата мероприятия, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "Дата начала мероприятия. Показывается наверху КП («Мероприятие») вместо «Актуально до», а в «Срок» — сколько дней до неё осталось" }
      - { name: valid_until, label: Актуально до, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "Если пусто — дата предложения + срок из настроек КП" }
      - { name: start, label: Старт работ (для графика), widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "Если пусто — дата предложения" }
      - name: scope
        label: Что входит (коротко)
        label_singular: пункт
        widget: list
        required: false
        field: { name: text, label: Пункт, widget: string }
      - { name: task, label: "Задача: описание", widget: text, required: false }
      - { name: sequence, label: "Задача: последовательность", widget: text, required: false }
      - name: stages
        label: Этапы
        label_singular: этап
        widget: list
        summary: "{{fields.title}} · {{fields.days}} дн."
        fields:
          - { name: title, label: Название, widget: string }
          - { name: description, label: Описание, widget: text, required: false }
          - { name: result, label: Результат работ, widget: text, required: false }
          - { name: days, label: Срок (календарных дней), widget: number, value_type: int, required: false }
          - { name: amount, label: "Стоимость, ₽", widget: number, value_type: int, required: false, hint: "Если пусто — сумма строк сметы ниже" }
          - name: items
            label: Строки сметы
            label_singular: строку
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.qty}} × {{fields.price}}"
            fields:
              - { name: name, label: Наименование, widget: string }
              - { name: qty, label: Кол-во, widget: number, value_type: float, default: 1 }
              - { name: unit, label: Ед., widget: string, required: false }
              - { name: price, label: "Цена, ₽", widget: number, value_type: float }
      - { name: price_note, label: Примечание к стоимости, widget: string, required: false, hint: "Например, «без НДС». Если пусто — из настроек КП" }
      - { name: schedule_note, label: Пояснение к графику, widget: text, required: false }
      - name: cases
        label: Релевантный опыт (кейсы; если пусто — по категории предложения)
        label_singular: кейс
        widget: list
        required: false
        fields:
          - { name: id, label: Кейс, widget: relation, collection: cases, value_field: id, search_fields: [name, id], display_fields: [name] }
          - { name: text, label: Почему это важно для клиента, widget: text, required: false, hint: "Если пусто — подзаголовок кейса" }
      - name: format
        label: Формат работы (если пусто — из настроек)
        label_singular: пункт
        widget: list
        required: false
        fields:
          - { name: title, label: Заголовок, widget: string }
          - { name: text, label: Текст, widget: text }
      - { name: pdf, label: Презентация (PDF), widget: file, required: false, hint: "Файл до ~50 МБ или ссылка на облако" }
      - { name: xlsx, label: Смета Excel (свой файл), widget: file, required: false, hint: "Если пусто — смета соберётся из этапов автоматически" }
      - { name: bitrix_deal, label: Сделка в Битрикс24, widget: string, required: false, hint: "Номер сделки или ссылка на неё. Менеджер проекта берётся из ответственного по сделке (если ниже в «Контактах» менеджер не заполнен)" }
      - { name: track_url, label: Ссылка из сквозной аналитики, widget: string, required: false, hint: "Уникальная ссылка из сервиса аналитики для этого КП — её копирует кнопка-скрепка" }
      - { name: code, label: Код счётчиков только для этого КП, widget: code, default_language: html, output_code_only: true, required: false, hint: "Вставляется в <head> этой страницы" }
      - name: contacts
        label: Контакты Median (пустые — из настроек)
        widget: object
        collapsed: true
        fields:
          - name: main
            label: Основной контакт
            widget: object
            required: false
            collapsed: true
            hint: "Кнопка «Связаться» и финальный блок с контактами"
            fields:
              - { name: name, label: Имя, widget: string, required: false }
              - { name: role, label: Должность, widget: string, required: false }
              - { name: tg, label: Telegram (ник без @), widget: string, required: false }
              - { name: phone, label: Телефон, widget: string, required: false }
              - { name: email, label: Почта, widget: string, required: false }
              - { name: photo, label: Фото, widget: image, required: false, media_folder: /media/kp, public_folder: media/kp }
          - name: pm
            label: Менеджер проекта
            widget: object
            required: false
            collapsed: true
            hint: "Показывается наверху КП и в команде проекта"
            fields:
              - { name: name, label: Имя, widget: string, required: false }
              - { name: role, label: Должность, widget: string, required: false }
              - { name: tg, label: Telegram (ник без @), widget: string, required: false }
              - { name: phone, label: Телефон, widget: string, required: false }
              - { name: email, label: Почта, widget: string, required: false }
              - { name: photo, label: Фото, widget: image, required: false, media_folder: /media/kp, public_folder: media/kp }
          - name: head
            label: Account director
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: name, label: Имя, widget: string, required: false }
              - { name: role, label: Должность, widget: string, required: false }
              - { name: tg, label: Telegram (ник без @), widget: string, required: false }
              - { name: phone, label: Телефон, widget: string, required: false }
              - { name: email, label: Почта, widget: string, required: false }
              - { name: photo, label: Фото, widget: image, required: false, media_folder: /media/kp, public_folder: media/kp }

  - name: vacancies
    label: Вакансии
    label_singular: вакансию
    folder: content/vacancies
    format: json
    extension: json
    identifier_field: id
    slug: "{{id}}"
    summary: "{{order}} · {{name}}{{on | ternary('', ' (скрыта)')}}"
    sortable_fields: [order, name]
    create: true
    delete: true
    fields:
      - { name: order, label: Порядок, widget: number, value_type: int, default: 100, hint: "Место в списке: меньше — выше. Шаг 10" }
      - { name: id, label: Адрес (id), widget: string, pattern: ['^[a-z0-9-]+$', 'только латиница в нижнем регистре, цифры и дефис'], hint: "Часть ссылки: /median-site/vacancy-<id>, например event-manager" }
      - { name: on, label: Показывать на сайте, widget: boolean, default: true, hint: "Выключите, когда вакансия закрыта: со страницы она уйдёт, файл останется — потом можно включить снова" }
      - { name: name, label: Название, widget: string }
      - name: ttl
        label: Строки заголовка
        label_singular: строка
        widget: list
        required: false
        hint: "Необязательно: по умолчанию первое слово контуром, остальное залитым"
        fields:
          - { name: text, label: Текст, widget: string }
          - { name: outline, label: Контуром, widget: boolean, default: false }
      - { name: img, label: Обложка (фото), widget: image, required: false, media_folder: /media/vacancies, public_folder: media/vacancies, hint: "Горизонтальное фото от 1920 px — фон шапки вакансии. Если пусто — обложка первого проекта из списка ниже" }
      - { name: vid, label: Обложка (видео), widget: file, required: false, media_folder: /media/video, public_folder: media/video, hint: "mp4 без звука, 6–10 с, до 1280 px — играет поверх фото" }
      - { name: hh, label: Ссылка на hh.ru, widget: string, required: false, hint: "Кнопка «Откликнуться на hh.ru»" }
      - { name: dept, label: Команда / направление, widget: string, required: false, hint: "Например, «Проектный отдел»" }
      - { name: city, label: Город, widget: string, required: false }
      - { name: format, label: Формат работы, widget: string, required: false, hint: "Офис, гибрид, удалённо" }
      - { name: employment, label: Занятость, widget: string, required: false, hint: "Полная, проектная…" }
      - { name: experience, label: Опыт, widget: string, required: false, hint: "Например, «1–3 года»" }
      - { name: salary, label: Зарплата, widget: string, required: false, hint: "Например, «от 80 000 ₽ на руки». Пусто — строки не будет" }
      - { name: lead, label: О вакансии (вступление), widget: text, required: false, hint: "Крупный текст после шапки. Абзацы разделяйте пустой строкой" }
      - name: sections
        label: Разделы вакансии
        label_singular: раздел
        widget: list
        required: false
        hint: "Классика: Чем предстоит заниматься · Что для нас важно · Будет плюсом · Что предлагаем"
        fields:
          - { name: h, label: Заголовок, widget: string, required: false, hint: "Можно оставить пустым — тогда только текст (например, финальный абзац)" }
          - { name: text, label: Абзацы перед списком, widget: list, required: false, field: { name: p, label: Абзац, widget: text } }
          - { name: items, label: Пункты, widget: list, required: false, field: { name: p, label: Пункт, widget: text }, hint: "Пункт, начинающийся с ##, — подзаголовок внутри раздела (например, «## 1. Продажи»)" }
      - name: cases
        label: Проекты, в которых предстоит участвовать
        hint: "Добавьте кейсы из списка кейсов — на странице вакансии они идут строками и открываются как обычные кейсы"
        label_singular: кейс
        widget: list
        required: false
        fields:
          - { name: id, label: Кейс, widget: relation, collection: cases, value_field: id, search_fields: [name, id], display_fields: [name] }
      - name: manager
        label: Руководитель (если пусто — из настроек вакансий)
        widget: object
        required: false
        collapsed: true
        fields:
              - { name: name, label: Имя, widget: string, required: false }
              - { name: role, label: Должность, widget: string, required: false }
              - { name: photo, label: Фото, widget: image, required: false, media_folder: /media/team, public_folder: media/team, hint: "Портрет, лучше вырезанный по контуру (png/webp с прозрачным фоном)" }
              - { name: text, label: Пара слов от руководителя, widget: text, required: false }
              - { name: tg, label: Telegram (ник без @), widget: string, required: false }
              - { name: email, label: Почта, widget: string, required: false }
              - { name: phone, label: Телефон, widget: string, required: false }

