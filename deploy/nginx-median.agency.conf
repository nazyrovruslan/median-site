# nginx для median.agency (сервер 158.160.186.96). Положить в /etc/nginx/sites-available/median.agency,
# ссылку — в sites-enabled, проверить `sudo nginx -t`, применить `sudo systemctl reload nginx`.
# Файлы сайта кладёт GitHub Actions (шаг «Выложить на сервер» в .github/workflows/pages.yml) в root ниже.
# Пути к сертификату поправить под те, куда админ положил AlphaSSL (или certbot).

server {
  listen 80;
  listen [::]:80;
  server_name median.agency www.median.agency;
  location /.well-known/acme-challenge/ { root /var/www/median.agency; }
  location / { return 301 https://median.agency$request_uri; }
}

# www → без www (сертификат должен включать www.median.agency)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.median.agency;
  ssl_certificate     /etc/ssl/median.agency/fullchain.pem;
  ssl_certificate_key /etc/ssl/median.agency/privkey.pem;
  return 301 https://median.agency$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name median.agency;
  ssl_certificate     /etc/ssl/median.agency/fullchain.pem;
  ssl_certificate_key /etc/ssl/median.agency/privkey.pem;

  root /var/www/median.agency;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # адреса без .html: /about → about.html, /x5datafest → x5datafest.html, /privacy → privacy.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  # /about.html → /about (одна версия адреса для поисковиков)
  location ~ ^/(.+)\.html$ {
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) { return 301 /$1$2; }
    try_files $uri =404;
  }

  # одна страница на все ошибки (404.html сама показывает нужный текст по ?code=)
  error_page 404 /404.html;
  error_page 500 502 503 504 /404.html?code=500;

  # кэш: медиа и шрифты надолго (у css/js в ссылках ?v=), html — всегда свежий
  location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|mp4|webm|woff2?)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location ~* \.(css|js)$ { expires 7d; try_files $uri =404; }

  # старый WordPress (адреса из индекса поисковиков; точный список — Яндекс Вебмастер → Индексирование → Страницы в поиске)
  location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|feed|category|tag|author|xmlrpc\.php|20[0-9][0-9])(/|$) { return 301 /; }
  location ~ ^/about-2/?$ { return 301 /about; }
  # кейсы лежали в /portfolio/<slug>/: совпадающие с новыми — на кейс, остальные — на главную
  location ~ ^/portfolio/(alfa-dvizh|southhub|alfa-battle|megafon|vtb|kaspersky)/?$ { return 301 /$1; }
  location ~ ^/portfolio(/|$) { return 301 /; }
  # новые пары дописывать сюда по одной строке:
  # location = /old-page/ { return 301 /new-page; }

  # закрытые КП не индексируются
  location /clients/ { add_header X-Robots-Tag "noindex, nofollow"; try_files $uri $uri/ $uri.html =404; }
}

# Старые домены: lp.median.agency (Тильда) и medianagency.ru — целиком на median.agency с сохранением пути.
# DNS: A-записи lp.median.agency, medianagency.ru, www.medianagency.ru → 158.160.186.96; сертификат:
# sudo certbot --nginx -d lp.median.agency -d www.lp.median.agency -d medianagency.ru -d www.medianagency.ru
server {
  listen 80;
  listen 443 ssl;
  server_name lp.median.agency www.lp.median.agency medianagency.ru www.medianagency.ru;
  # ssl_certificate / ssl_certificate_key — certbot допишет сам
  return 301 https://median.agency$request_uri;
}
